name: Static
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf install -y git python3 bash just appstream rpmlint ShellCheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: just check
      - run: python3 scripts/test_panel_matrix.py
      - run: appstreamcli validate --no-net com.github.loofi.aiusagemonitor.metainfo.xml
      - run: rpmlint plasma-ai-usage-monitor.spec
      - run: shellcheck scripts/*.sh scripts/demo/*.sh
